<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PageMind AI</title>
  <style>
    body { width: 380px; padding: 16px; font-family: system-ui, -apple-system, sans-serif; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    button { width: 100%; padding: 10px; margin: 6px 0; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1557b0; }
    #output { margin-top: 12px; padding: 10px; background: #f8f9fa; border-radius: 6px; white-space: pre-wrap; font-size: 13px; max-height: 300px; overflow-y: auto; }
    .usage { font-size: 12px; color: #666; margin-top: 8px; }
    .premium { color: #d93025; font-weight: bold; }
  </style>
</head>
<body>
  <h2>PageMind AI</h2>
  <button id="summarize">Summarize Page</button>
  <button id="keypoints">Extract Key Points</button>
  <button id="social">Generate Social Posts</button>
  <div id="output">Click a button to analyze the current page.</div>
  <div class="usage" id="usage">Usage: 0 / 10 free today. Upgrade for unlimited.</div>
  <button id="upgrade" style="background:#34a853; margin-top:10px;">Upgrade to Premium ($7/mo)</button>
  <script src="popup.js"></script>
</body>
</html>
